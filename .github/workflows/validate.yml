name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: pip install homeassistant==2026.8.0 pyyaml

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.yaml"):
              with path.open("r", encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"Validated {path}")
          PY

      - name: Compile Python
        run: |
          python -m compileall -q acr122u_reader/app
          python -m compileall -q acr122u_reader/custom_components/acr122u

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
              print(f"Validated {path}")
          PY

      - name: Test Home Assistant device triggers
        env:
          PYTHONPATH: acr122u_reader
        run: python -m unittest discover -s tests -v
